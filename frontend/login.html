<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login - Krewe Mystique</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">Krewe Mystique</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="/">Home</a>
          <a href="/history.html">History</a>
          <a href="/royal-court.html">Royal Court</a>
          <a href="/photos.html">Photos</a>
          <a href="/events.html">Events</a>
          <a href="/contact.html">Contact</a>
          <a href="/register.html">Join</a>
          <a href="/shop.html" id="nav-shop-link" style="display:none;">Shop</a>
        </nav>
      </div>
    </header>

    <main class="auth-page">
      <div class="auth-card container">
        <h1>Member Login</h1>
        <form id="login-form">
          <label for="login_email">Email</label>
          <input id="login_email" name="email" type="email" required />

          <label for="login_password">Password</label>
          <input id="login_password" name="password" type="password" required />

          <div id="mfa-code-group" hidden>
            <p id="mfa-prompt" class="field-hint"></p>
            <label for="mfa_code">Verification code</label>
            <input id="mfa_code" name="mfa_code" inputmode="numeric" autocomplete="one-time-code" />
            <div id="mfa-method-switch" hidden style="margin-top:0.5rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
              <button type="button" class="button" data-mfa-method="email">Email me a code</button>
              <button type="button" class="button" data-mfa-method="sms">Text me a code</button>
            </div>
            <button type="button" id="mfa-resend-button" hidden style="margin-top:0.5rem; background:none; border:none; color:var(--accent); text-decoration:underline; cursor:pointer; padding:0; font:inherit;">Resend code</button>
          </div>

          <button class="button primary" type="submit">Log in</button>
        </form>
        <p>
          New here? <a href="/register.html">Create an account</a>
        </p>
      </div>
    </main>

    <script src="script.js?v=20250720c"></script>
    <script src="auth.js?v=20250722c"></script>
  </body>
</html>
