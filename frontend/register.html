<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register - Krewe Mystique</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">Krewe Mystique</a>
        <div id="nav-mount"></div>
      </div>
    </header>

    <section class="hero join-hero" data-admin-background-var="--admin-bg-image" data-admin-static-section-key="static-section:0" data-admin-section-type="static" data-admin-image-path="/assets/images/MardiGras_Pic15.jpg" style="--admin-bg-image: url(&quot;/assets/images/MardiGras_Pic15.jpg?v=2026-07-16T01%3A00%3A00.000Z&quot;);">
      <div class="hero-overlay"></div>
      <div class="container">
        <p class="eyebrow">Krewe Mystique de la Capitale</p>
        <h1>Join the Krewe</h1>
        <p class="hero-copy">Become part of Baton Rouge's oldest parading krewe</p>
      </div>
    </section>

    <main class="auth-page">
      <div class="auth-card container">
        <h1>Create an account</h1>
        <form id="register-form">
          <label for="full_name">Full name</label>
          <input id="full_name" name="full_name" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />

          <label for="password">Password</label>
          <input id="password" name="password" type="password" required />

          <label for="reg-phone">Phone Number</label>
          <input id="reg-phone" name="phone" type="tel" placeholder="e.g. 555-867-5309" />

          <p class="field-hint" style="margin:0.25rem 0 0.5rem;">Two-factor sign-in (email) will be set up for your account. You can switch to text-message (SMS) later from your profile.</p>

          <label for="reg-birthdate">Date of Birth</label>
          <input id="reg-birthdate" name="birthdate" type="date" />

          <label for="reg-occupation">Occupation</label>
          <input id="reg-occupation" name="occupation" type="text" placeholder="e.g. Teacher, Engineer…" />

          <label for="reg-sponsor">Krewe Member Sponsor</label>
          <input id="reg-sponsor" name="sponsor_name" type="text" placeholder="Name of member sponsoring you" />

          <label for="reg-address">Street Address</label>
          <input id="reg-address" name="address" type="text" placeholder="123 Main St" />

          <div style="display:grid;grid-template-columns:1fr 4rem 7rem;gap:0.5rem;">
            <div>
              <label for="reg-city">City</label>
              <input id="reg-city" name="city" type="text" placeholder="New Orleans" style="width:100%;" />
            </div>
            <div>
              <label for="reg-state">State</label>
              <input id="reg-state" name="state" type="text" placeholder="LA" maxlength="2" style="width:100%;text-transform:uppercase;" />
            </div>
            <div>
              <label for="reg-zip">Zip</label>
              <input id="reg-zip" name="zip" type="text" placeholder="70130" maxlength="10" style="width:100%;" />
            </div>
          </div>

          <div id="verification-code-group" hidden>
            <label for="verification_code">Verification code</label>
            <input id="verification_code" name="verification_code" inputmode="numeric" autocomplete="one-time-code" />
            <button type="button" id="resend-code-button" hidden style="margin-top:0.5rem; background:none; border:none; color:inherit; text-decoration:underline; cursor:pointer; padding:0; font:inherit;">Resend code</button>
          </div>

          <div id="mfa-code-group" hidden>
            <p id="mfa-prompt" class="field-hint"></p>
            <label for="mfa_code">Verification code</label>
            <input id="mfa_code" name="mfa_code" inputmode="numeric" autocomplete="one-time-code" />
            <div id="mfa-method-switch" hidden style="margin-top:0.5rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
              <button type="button" class="button" data-mfa-method="email">Email me a code</button>
              <button type="button" class="button" data-mfa-method="sms">Text me a code</button>
              <button type="button" class="button" data-mfa-method="authenticator">Use authenticator app</button>
            </div>
            <button type="button" id="mfa-resend-button" hidden style="margin-top:0.5rem; background:none; border:none; color:var(--accent); text-decoration:underline; cursor:pointer; padding:0; font:inherit;">Resend code</button>
            <div id="mfa-otp-setup" hidden style="margin-top:0.75rem;"></div>
          </div>

          <p id="register-feedback" aria-live="polite"></p>

          <button class="button primary" type="submit" id="register-submit-button">Register</button>
        </form>
        <p>
          Already have an account? <a href="/login.html">Log in</a>
        </p>
      </div>
    </main>

    <script src="script.js?v=20250720d"></script>
    <script src="auth.js?v=20260809b"></script>
  </body>
</html>
