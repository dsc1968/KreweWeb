<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Submission Completed - Krewe Mystique</title>
    <link rel="stylesheet" href="styles.css?v=20260819c" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">
          <img class="brand-logo" src="assets/images/Krewe%20Mystique%20Logo%20-%20Color1%20-%20nobg.png" alt="">
          <span class="brand-text">Krewe Mystique</span>
        </a>
        <div id="nav-mount"></div>
      </div>
    </header>

    <main class="auth-page">
      <div class="auth-card container">
        <div aria-hidden="true" style="width:64px;height:64px;border-radius:50%;background:rgba(124,252,155,0.15);color:#7CFC9B;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 1rem;">&#10003;</div>
        <h1>Submission Completed</h1>
        <p id="submission-message">Thank you! Your submission has been received. We will review it and contact you via email.</p>
        <div class="hero-actions">
          <a class="button primary" href="/">Return Home</a>
          <a class="button secondary" id="submission-secondary-link" href="/contact.html">Contact Us</a>
        </div>
      </div>
    </main>

    <script src="script.js?v=20260819d"></script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var type = params.get('type');
        var msg = document.getElementById('submission-message');
        var sec = document.getElementById('submission-secondary-link');
        if (type === 'parade') {
          msg.textContent = 'Thank you! Your parade entry application has been received. The parade committee will review it and contact you using the email you provided.';
          sec.textContent = 'View the Parade';
          sec.href = '/parade.html';
        } else if (type === 'krewe') {
          msg.textContent = 'Thank you! Your request to join the Krewe has been received. Our team will review it and contact you using the email you provided.';
          sec.textContent = 'Log In';
          sec.href = '/login.html';
        }
      })();
    </script>
  </body>
</html>
