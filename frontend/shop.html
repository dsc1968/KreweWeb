<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Shop - Krewe Mystique</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* ── Shop page ───────────────────────────────────────────────────── */
      .shop-layout {
        padding-top: 2rem;
        padding-bottom: 4rem;
      }

      .shop-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 1.75rem;
      }

      .shop-header h1 { margin: 0; font-size: clamp(1.5rem, 3vw, 2rem); }

      .shop-cart-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.55rem 1.1rem;
        border-radius: 999px;
        border: 1px solid rgba(255,210,98,0.4);
        background: rgba(255,210,98,0.08);
        color: var(--accent);
        cursor: pointer;
        font: inherit;
        font-size: 0.92rem;
        font-weight: 600;
        transition: background 0.15s, border-color 0.15s;
      }
      .shop-cart-btn:hover { background: rgba(255,210,98,0.16); border-color: rgba(255,210,98,0.6); }

      .shop-cart-count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1.3rem;
        height: 1.3rem;
        border-radius: 999px;
        background: var(--accent);
        color: #08102a;
        font-size: 0.72rem;
        font-weight: 800;
        padding: 0 0.25rem;
      }

      /* Category filter */
      .shop-filters {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }

      .shop-filter-btn {
        padding: 0.35rem 0.9rem;
        border-radius: 999px;
        border: 1px solid var(--border-medium);
        background: var(--overlay-soft);
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 0.82rem;
        transition: all 0.15s;
      }
      .shop-filter-btn.is-active,
      .shop-filter-btn:hover {
        border-color: rgba(255,210,98,0.5);
        background: rgba(255,210,98,0.1);
        color: var(--accent);
      }

      /* Product rows */
      .shop-grid {
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
      }

      .shop-product-card {
        background: var(--db-card-bg, linear-gradient(180deg, rgba(10,19,44,0.98), rgba(15,26,56,0.95)));
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        flex-direction: row;
        align-items: stretch;
        transition: border-color 0.2s, transform 0.2s;
        position: relative;
      }
      .shop-product-card:hover { border-color: rgba(255,210,98,0.4); transform: translateY(-1px); }
      .shop-product-card.is-selected { border-color: rgba(255,210,98,0.75); }

      /* Multi-select checkbox overlay */
      .shop-select-overlay {
        position: absolute;
        top: 0.5rem;
        left: 0.5rem;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.22rem 0.5rem;
        border-radius: 999px;
        background: rgba(8,16,42,0.78);
        border: 1px solid rgba(255,255,255,0.2);
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
      }
      .shop-select-overlay input {
        width: 1rem;
        height: 1rem;
        margin: 0;
        accent-color: var(--accent);
        cursor: pointer;
      }
      .shop-product-card.is-selected .shop-select-overlay { color: var(--accent); border-color: rgba(255,210,98,0.6); }

      /* Batch add-to-cart bar */
      .shop-batch-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
        padding: 0.6rem 0.9rem;
        border-radius: 12px;
        border: 1px solid rgba(255,210,98,0.35);
        background: rgba(255,210,98,0.07);
      }
      .shop-batch-info { font-size: 0.88rem; font-weight: 600; color: var(--accent); }
      .shop-batch-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

      .shop-product-img,
      .shop-product-img-placeholder {
        width: 150px;
        min-width: 150px;
        align-self: stretch;
        object-fit: contain;
        background: rgba(2,8,22,0.8);
      }

      .shop-product-img-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(2,8,22,0.6);
        font-size: 2.6rem;
        color: rgba(255,255,255,0.15);
      }

      .shop-product-body {
        padding: 1rem 1.15rem;
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        flex: 1;
        min-width: 0;
      }

      .shop-product-category {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--accent);
      }

      .shop-product-name {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 700;
        line-height: 1.3;
        color: var(--text);
      }

      .shop-product-desc {
        margin: 0;
        font-size: 0.85rem;
        color: var(--muted);
        line-height: 1.5;
      }

      /* Size chips */
      .shop-size-label {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--text);
        margin-top: 0.4rem;
      }
      .shop-size-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: 0.15rem;
      }
      .shop-size-chip {
        min-width: 2.4rem;
        padding: 0.3rem 0.55rem;
        border-radius: 8px;
        border: 1px solid var(--border-strong);
        background: var(--field-bg);
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 0.8rem;
        font-weight: 600;
        transition: all 0.15s;
      }
      .shop-size-chip:hover { border-color: rgba(255,210,98,0.5); color: var(--accent); }
      .shop-size-chip.is-active {
        border-color: var(--accent);
        background: rgba(255,210,98,0.16);
        color: var(--accent);
      }

      .shop-product-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-top: auto;
        padding-top: 0.4rem;
        flex-wrap: wrap;
      }

      .shop-product-price {
        font-size: 1.15rem;
        font-weight: 800;
        color: var(--accent);
      }

      .shop-product-stock {
        font-size: 0.78rem;
        color: var(--muted);
      }

      .shop-add-btn {
        padding: 0.45rem 1rem;
        border-radius: 999px;
        border: 1px solid rgba(255,210,98,0.4);
        background: rgba(255,210,98,0.1);
        color: var(--accent);
        cursor: pointer;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        transition: all 0.15s;
        white-space: nowrap;
      }
      .shop-add-btn:hover:not(:disabled) { background: rgba(255,210,98,0.2); border-color: rgba(255,210,98,0.7); }
      .shop-add-btn:disabled { opacity: 0.45; cursor: not-allowed; }

      /* Donation section */
      .shop-donation {
        margin-top: 1.5rem;
        background: var(--db-card-bg, linear-gradient(180deg, rgba(10,19,44,0.98), rgba(15,26,56,0.95)));
        border: 1px solid rgba(255,210,98,0.3);
        border-radius: 16px;
        padding: 1.2rem 1.25rem;
      }
      .shop-donation-title {
        margin: 0 0 0.3rem;
        font-size: 1.05rem;
        font-weight: 800;
        color: var(--accent);
      }
      .shop-donation-desc {
        margin: 0 0 0.9rem;
        font-size: 0.85rem;
        color: var(--muted);
        line-height: 1.5;
      }
      .shop-donation-row {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .shop-donation-input-wrap {
        display: flex;
        align-items: center;
        background: var(--field-bg);
        border: 1px solid var(--field-border);
        border-radius: 10px;
        padding: 0 0.6rem;
      }
      .shop-donation-input-wrap:focus-within { border-color: var(--accent); }
      .shop-donation-currency { color: var(--muted); font-weight: 700; }
      .shop-donation-input {
        width: 120px;
        padding: 0.5rem 0.4rem;
        border: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 1rem;
        outline: none;
      }
      .shop-donation-input::placeholder { color: var(--field-placeholder); }
      .shop-donation-feedback { font-size: 0.8rem; margin-top: 0.5rem; }

      /* ── Cart drawer ─────────────────────────────────────────────── */
      .shop-cart-overlay {
        position: fixed;
        inset: 0;
        background: rgba(2,8,22,0.7);
        z-index: 500;
        display: none;
      }
      .shop-cart-overlay.is-open { display: block; }

      .shop-cart-drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(420px, 100vw);
        background: var(--card-bg);
        border-left: 1px solid var(--border);
        z-index: 501;
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.28s ease;
        box-shadow: -8px 0 40px rgba(0,0,0,0.4);
      }
      .shop-cart-drawer.is-open { transform: translateX(0); }

      .shop-cart-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid var(--border-subtle);
        flex-shrink: 0;
      }

      .shop-cart-head h2 { margin: 0; font-size: 1.05rem; }

      .shop-cart-close {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 1.5rem;
        cursor: pointer;
        line-height: 1;
        padding: 0.2rem;
      }

      .shop-cart-items {
        flex: 1;
        overflow-y: auto;
        padding: 1rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .shop-cart-empty {
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
        padding: 2rem 0;
      }

      .shop-cart-item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.35rem 0.75rem;
        align-items: start;
        padding: 0.75rem;
        border-radius: 12px;
        background: var(--overlay-subtle);
        border: 1px solid var(--border-subtle);
      }

      .shop-cart-item-name {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text);
        grid-column: 1;
      }

      .shop-cart-item-price {
        font-size: 0.85rem;
        color: var(--accent);
        font-weight: 700;
        text-align: right;
        grid-column: 2;
        grid-row: 1;
      }

      .shop-cart-item-controls {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        grid-column: 1;
      }

      .shop-cart-qty-btn {
        width: 1.6rem;
        height: 1.6rem;
        border-radius: 6px;
        border: 1px solid var(--border-medium);
        background: var(--overlay-medium);
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 0.9rem;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .shop-cart-qty-btn:hover { background: var(--overlay-strong); }

      .shop-cart-qty-val { font-size: 0.88rem; min-width: 1.5rem; text-align: center; }

      .shop-cart-item-remove {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 0.78rem;
        padding: 0;
        grid-column: 2;
        grid-row: 2;
        text-align: right;
        text-decoration: underline;
        transition: color 0.15s;
      }
      .shop-cart-item-remove:hover { color: #f87171; }

      .shop-cart-item-beneficiary {
        grid-column: 1 / -1;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        margin-top: 0.15rem;
      }
      .shop-cart-item-beneficiary label {
        font-size: 0.72rem;
        color: var(--muted);
        font-weight: 600;
      }
      .shop-cart-item-beneficiary select {
        width: 100%;
        padding: 0.4rem 0.55rem;
        border-radius: 8px;
        border: 1px solid var(--border-medium);
        background: var(--select-bg);
        color: var(--text);
        font: inherit;
        font-size: 0.82rem;
        color-scheme: var(--select-scheme);
      }
      .shop-cart-item-beneficiary select option {
        background: var(--select-option-bg);
        color: var(--text);
      }

      .shop-cart-foot {
        padding: 1rem 1.5rem 1.5rem;
        border-top: 1px solid var(--border-subtle);
        /* Shrink and scroll internally so the Pay/Cancel buttons stay reachable
           when the payment UI makes this region taller than the viewport. */
        flex-shrink: 1;
        overflow-y: auto;
      }

      .shop-cart-total {
        display: flex;
        justify-content: space-between;
        font-size: 1rem;
        font-weight: 700;
        margin-bottom: 1rem;
      }

      .shop-cart-total span:last-child { color: var(--accent); }

      .shop-cart-feedback {
        font-size: 0.85rem;
        min-height: 1.2em;
        margin-bottom: 0.6rem;
        color: var(--muted);
      }

      /* ── Payment-method chooser (PayPal vs Credit Card) ─────────────────── */
      .shop-pay-methods {
        display: flex;
        gap: 0.5rem;
      }
      .shop-pay-method-btn {
        flex: 1;
        padding: 0.5rem 0.5rem;
        border-radius: 10px;
        border: 1px solid var(--border-medium);
        background: var(--overlay-soft);
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        transition: all 0.15s;
      }
      .shop-pay-method-btn:hover { border-color: rgba(255,210,98,0.5); color: var(--text); }
      .shop-pay-method-btn.is-active {
        border-color: rgba(255,210,98,0.7);
        background: rgba(255,210,98,0.14);
        color: var(--accent);
      }

      /* Stripe Payment Element (cards, wallets, bank redirects, Link, etc.) */
      .shop-stripe-wrap {
        padding: 0.9rem;
        border-radius: 12px;
        border: 1px solid var(--border-medium);
        background: var(--field-bg);
      }
      .shop-stripe-hint {
        margin: 0 0 0.7rem;
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.45;
      }
      .shop-stripe-element {
        /* The Stripe Payment Element renders its own themed fields; this just
           reserves space and keeps the dark surface. */
        min-height: 140px;
      }
      .shop-stripe-errors {
        color: #f87171;
        font-size: 0.78rem;
        min-height: 1em;
        margin-top: 0.45rem;
      }

      /* ── Orders tab ──────────────────────────────────────────────── */
      .shop-order-card {
        background: var(--db-card-bg, linear-gradient(180deg, rgba(10,19,44,0.98), rgba(15,26,56,0.95)));
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1rem 1.25rem;
        margin-bottom: 0.85rem;
      }

      .shop-order-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.65rem;
      }

      .shop-order-id { font-size: 0.8rem; color: var(--muted); }
      .shop-order-date { font-size: 0.8rem; color: var(--muted); }
      .shop-order-total { font-weight: 700; color: var(--accent); }

      .shop-order-status {
        display: inline-block;
        padding: 0.15rem 0.55rem;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .shop-order-status.pending   { background: rgba(255,210,98,0.14); border: 1px solid rgba(255,210,98,0.3); color: var(--accent); }
      .shop-order-status.processing{ background: rgba(96,165,250,0.14); border: 1px solid rgba(96,165,250,0.3); color: #93c5fd; }
      .shop-order-status.shipped   { background: rgba(167,243,208,0.14); border: 1px solid rgba(167,243,208,0.3); color: #6ee7b7; }
      .shop-order-status.completed { background: rgba(74,222,128,0.14); border: 1px solid rgba(74,222,128,0.3); color: #4ade80; }
      .shop-order-status.cancelled { background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.3); color: #f87171; }

      .shop-orders-pagination {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        justify-content: center;
        margin-top: 1rem;
      }
      .shop-orders-pagination:empty { display: none; }
      .shop-page-btn {
        min-width: 2rem;
        padding: 0.35rem 0.6rem;
        border-radius: 8px;
        border: 1px solid var(--border-medium);
        background: var(--overlay-medium);
        color: var(--text);
        font: inherit;
        font-size: 0.82rem;
        cursor: pointer;
      }
      .shop-page-btn:hover { background: var(--overlay-strong); }
      .shop-page-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #1a1206;
        font-weight: 700;
      }

      .shop-order-items { font-size: 0.85rem; color: var(--muted); line-height: 1.8; }

      /* Tabs */
      .shop-tabs {
        display: flex;
        gap: 0.25rem;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        margin-bottom: 1.5rem;
      }
      .shop-tab-btn {
        padding: 0.5rem 1.1rem;
        border-radius: 10px 10px 0 0;
        border: 1px solid transparent;
        border-bottom: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 500;
        position: relative;
        bottom: -1px;
        transition: color 0.15s, background 0.15s;
      }
      .shop-tab-btn:hover { background: var(--field-bg); color: var(--text); }
      .shop-tab-btn.is-active {
        background: rgba(10,19,44,0.98);
        border-color: rgba(255,255,255,0.1);
        color: var(--accent);
        font-weight: 700;
      }
      .shop-panel { display: none; }
      .shop-panel.is-active { display: block; }

      @media (max-width: 600px) {
        .shop-grid { gap: 0.75rem; }
        .shop-product-card { flex-direction: column; }
        .shop-product-img,
        .shop-product-img-placeholder { width: 100%; min-width: 0; aspect-ratio: 16/9; }
        .shop-cart-drawer { width: 100vw; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">
          <img class="brand-logo" src="assets/images/Krewe%20Mystique%20Logo%20-%20Color1.png" alt="">
          <span class="brand-text">Krewe Mystique</span>
        </a>
        <div id="nav-mount"></div>
      </div>
    </header>

    <!-- Cart overlay + drawer -->
    <div id="shop-cart-overlay" class="shop-cart-overlay"></div>
    <aside id="shop-cart-drawer" class="shop-cart-drawer" aria-label="Shopping cart">
      <div class="shop-cart-head">
        <h2>Your Cart</h2>
        <button id="shop-cart-close" class="shop-cart-close" aria-label="Close cart">&times;</button>
      </div>
      <div id="shop-cart-items" class="shop-cart-items">
        <p class="shop-cart-empty">Your cart is empty.</p>
      </div>
      <div class="shop-cart-foot">
        <div class="shop-cart-total">
          <span>Total</span>
          <span id="shop-cart-total-val">$0.00</span>
        </div>
        <div id="shop-cart-feedback" class="shop-cart-feedback"></div>
        <button id="shop-checkout-btn" class="button" style="width:100%;">Checkout</button>

        <!-- Payment-method chooser (shown only when both PayPal and Stripe are enabled) -->
        <div id="payment-method-chooser" class="shop-pay-methods" style="display:none;margin-top:0.5rem;">
          <button type="button" class="shop-pay-method-btn is-active" data-method="paypal">PayPal</button>
          <button type="button" class="shop-pay-method-btn" data-method="card">Credit Card</button>
        </div>

        <div id="paypal-button-container" style="margin-top:0.5rem;"></div>

        <div id="stripe-payment-container" style="margin-top:0.5rem;display:none;">
          <div class="shop-stripe-wrap">
            <p class="shop-stripe-hint">Pay securely with a credit or debit card. Where supported, you can also use Apple&nbsp;Pay or Google&nbsp;Pay.</p>
            <div id="stripe-payment-element" class="shop-stripe-element"></div>
            <div id="stripe-payment-errors" class="shop-stripe-errors" role="alert"></div>
            <button id="stripe-pay-btn" class="button" style="width:100%;margin-top:0.6rem;">Pay</button>
          </div>
        </div>

        <button id="shop-pay-cancel-btn" class="button secondary" style="width:100%;margin-top:0.5rem;display:none;">Cancel</button>
      </div>
    </aside>

    <main class="shop-layout container">
      <div id="shop-page-content" style="display:none;">

        <div class="shop-header">
          <h1>Krewe Shop</h1>
          <div style="display:flex;align-items:center;gap:0.75rem;">
            <a id="shop-manage-btn" href="/shop-admin.html" class="button secondary" style="font-size:0.85rem;padding:0.4rem 1rem;text-decoration:none;display:none;">Manage Store</a>
            <button id="shop-open-cart-btn" class="shop-cart-btn">
              🛒 Cart <span id="shop-cart-count" class="shop-cart-count">0</span>
            </button>
          </div>
        </div>

        <nav class="shop-tabs">
          <button class="shop-tab-btn is-active" data-shop-tab="products">Browse</button>
          <button class="shop-tab-btn" data-shop-tab="orders">My Orders</button>
        </nav>

        <!-- Browse panel -->
        <div class="shop-panel is-active" data-shop-panel="products">

          <div id="shop-batch-bar" class="shop-batch-bar" style="display:none;">
            <span id="shop-batch-info" class="shop-batch-info">0 selected</span>

            </div>
          </div>
          <div id="shop-product-feedback" style="color:var(--muted);font-size:0.9rem;margin-bottom:1rem;"></div>
